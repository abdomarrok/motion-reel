<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#080A12}canvas{display:block;max-height:100vh}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, DUR = 24;
const g = document.getElementById('c').getContext('2d'); g.direction='rtl'; g.textBaseline='alphabetic';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

// Closed-form damped spring, 0 -> 1. Pure function of time.
function spring(t, k = 170, d = 26) {
 if (t <= 0) return 0;
 const w0 = Math.sqrt(k), z = d / (2 * w0);
 if (z < 1) {
  const wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
 }
 return 1 - Math.exp(-w0 * t) * (1 + w0 * t);   // z >= 1 treated as critical
}

// Seeded noise, never Math.random: the render must be identical every run
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
 let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
 t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SCENES = [
 { from: 0, to: 2, draw(t) {
   const s = spring(t-0.1,240,20); g.save(); g.direction='rtl'; g.globalAlpha = clamp(t*5);
   g.fillStyle='#FFFFFF'; g.font='800 180px "Cairo","Noto Sans Arabic",Arial,sans-serif';
   g.textAlign='center'; g.translate(W/2,H*0.28); g.scale(0.95+0.05*s,0.95+0.05*s);
   g.fillText('???? ?????',0,0); g.restore();
   g.save(); g.fillStyle='#6EA0FF'; const bar=spring(t,200,22); g.fillRect(W/2-320*bar,H*0.32,640*bar,14); g.restore();
 }},
 { from: 2, to: 5, draw(t) {
   const s=spring(t-0.15,220,22); g.save(); g.direction='rtl'; g.globalAlpha=clamp((t-0.15)*5);
   g.fillStyle='#FFFFFF'; g.font='700 120px "Cairo","Noto Sans Arabic",Arial,sans-serif';
   g.textAlign='center'; g.translate(W/2,H*0.26); g.scale(1+0.02*s,1+0.02*s);
   g.fillText('????? ????? ????? ???? ?????',0,0); g.restore();
   g.save(); g.fillStyle='#6EA0FF'; const card=spring(t,180,24); g.fillRect(80,H*0.36,W-160,8*card); g.restore();
 }},
 { from: 5, to: 8, draw(t) {
   g.save(); g.direction='rtl';
   ['???? ????','?????','?????'].forEach((txt,i)=>{ const st=t-i*0.12; const s=spring(st,260,18);
    g.save(); g.globalAlpha=clamp(st*4); g.translate(W/2,H*0.24+i*160); g.scale(0.9+0.1*s,0.9+0.1*s);
    g.fillStyle='#FFFFFF'; g.font='700 110px "Cairo","Noto Sans Arabic",Arial,sans-serif';
    g.textAlign='center'; g.fillText(txt,0,0); g.fillStyle='#6EA0FF'; g.fillRect(-200*s,60,400*s,8); g.restore(); });
   g.restore();
 }},
 { from: 8, to: 12, draw(t) {
   const s=spring(t-0.1,240,18); g.save(); g.direction='rtl'; g.globalAlpha=clamp((t-0.1)*5);
   g.fillStyle='#FFFFFF'; g.font='800 220px "Cairo","Noto Sans Arabic",Arial,sans-serif';
   g.textAlign='center'; g.translate(W/2,H*0.28); g.scale(0.98+0.02*s,0.98+0.02*s);
   g.fillText('MARROK',0,0); g.fillStyle='#6EA0FF'; g.fillRect(-280*s,90,560*s,12); g.restore();
 }},
 { from: 12, to: 16, draw(t) {
   const s=spring(t-0.1,220,20); g.save(); g.direction='ltr'; g.globalAlpha=clamp((t-0.1)*5);
   g.fillStyle='#FFFFFF'; g.font='800 140px "Cairo","Noto Sans Arabic",Arial,sans-serif';
   g.textAlign='center'; g.translate(W/2,H*0.26); g.scale(1+0.02*s,1+0.02*s); g.fillText('Smooth. Fast. Minimal.',0,0); g.restore();
   g.save(); g.fillStyle='#6EA0FF'; const bar=spring(t-0.2,180,22); g.fillRect(W/2-360*bar,H*0.32,720*bar,8); g.restore();
 }},
 { from: 16, to: 20, draw(t) {
   g.save(); g.direction='rtl'; const s1=spring(t-0.1,220,20), s2=spring(t-0.25,220,20); g.globalAlpha=clamp((t-0.1)*5);
   g.fillStyle='#FFFFFF'; g.font='700 100px "Cairo","Noto Sans Arabic",Arial,sans-serif'; g.textAlign='center'; g.translate(W/2,H*0.24);
   g.scale(1+0.01*s1,1+0.01*s1); g.fillText('??? DM ????? ???? ?????',0,0);
   g.globalAlpha=clamp((t-0.25)*5); g.font='600 60px "Cairo","Noto Sans Arabic",Arial,sans-serif'; g.fillText('DM for your website',0,90); g.restore();
   g.save(); g.fillStyle='#6EA0FF'; const bar=spring(t-0.2,200,22); g.fillRect(W/2-420*bar,H*0.38,840*bar,6); g.restore();
 }},
 { from: 20, to: 24, draw(t) {
   g.save(); g.direction='rtl'; const s=spring(t-0.1,240,18); g.globalAlpha=clamp((t-0.1)*5);
   g.fillStyle='#FFFFFF'; g.font='800 160px "Cairo","Noto Sans Arabic",Arial,sans-serif'; g.textAlign='center'; g.translate(W/2,H*0.24);
   g.scale(0.99+0.01*s,0.99+0.01*s); g.fillText('MARROK Â· marrok.org',0,0);
   g.font='600 60px "Cairo","Noto Sans Arabic",Arial,sans-serif'; g.fillText('Ø¯ÙØ± DM Ø£Ù Ø²ÙØ±Ù marrok.org',0,90); g.restore();
   g.save(); g.fillStyle='#6EA0FF'; const bar=spring(t-0.2,200,22); g.fillRect(W/2-460*bar,H*0.38,920*bar,6); g.restore();
 }}
];

function draw(t) {
 g.fillStyle = '#080A12'; g.fillRect(0, 0, W, H);
 for (const s of SCENES) if (t >= s.from && t < s.to) s.draw(t - s.from);
}
window.seek = (t) => { draw(t); return true; };

// Live preview in a normal browser, off during headless render
if (!navigator.webdriver) {
 const t0 = performance.now();
 (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
}
</script>
